openapi: 3.1.0
info:
  title: Vibe OS Backend API
  description: 开源私有 AI NAS 系统后端服务接口文档
  version: 0.2.2
  contact:
    email: icm@sustech.edu.cn

servers:
  - url: http://127.0.0.1:3000
    description: 本地开发服务器

security:
  - bearerAuth: []

paths:
  /api/health:
    get:
      summary: 健康检查
      description: 无需认证，返回服务运行状态
      security: []
      tags: [系统]
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/system/init-data:
    post:
      summary: 初始化数据目录
      description: 首次启动时创建 /data/ 完整目录结构并校验权限
      tags: [系统初始化]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  description: 是否强制重建已存在的目录
                  default: false
      responses:
        '201':
          description: 初始化成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/InitDataResult'
        '403':
          description: 以 root 运行被拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/user/{uid}/quota:
    get:
      summary: 查询用户配额
      description: 获取指定 UID 用户的磁盘配额与使用量
      tags: [系统初始化]
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
          description: 用户 UID
      responses:
        '200':
          description: 配额信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/UserQuotaInfo'
        '404':
          description: 用户或数据目录不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/user/{uid}/init:
    post:
      summary: 初始化用户数据空间
      description: 创建用户数据目录并设置磁盘配额
      tags: [系统初始化]
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quotaBytes:
                  type: string
                  description: 配额（字节，字符串形式）
      responses:
        '201':
          description: 用户空间初始化成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/UserQuotaInfo'

  /api/hardware/disk-health:
    get:
      summary: 磁盘健康状态
      description: 获取所有磁盘的 SMART 健康数据
      tags: [硬件监控]
      responses:
        '200':
          description: 磁盘健康报告
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DiskHealthResponse'

  /api/hardware/network-drivers:
    get:
      summary: 网卡驱动状态
      description: 检测主流消费级网卡驱动加载状态（RTL8125/8156, i225/i226, ConnectX）
      tags: [硬件监控]
      responses:
        '200':
          description: 网卡驱动报告
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/NetworkDriversResponse'

  /api/container/deploy:
    post:
      summary: 部署 AI 应用容器
      description: 通过 Docker 部署容器化 AI 应用，卷挂载路径必须在 /data/ 内
      tags: [容器编排]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContainerDeployRequest'
      responses:
        '201':
          description: 部署成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ContainerDeployResponse'
        '400':
          description: 参数校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/container/list:
    get:
      summary: 容器列表
      tags: [容器编排]
      parameters:
        - name: all
          in: query
          schema:
            type: boolean
            default: true
          description: 是否包含已停止容器
      responses:
        '200':
          description: 容器列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContainerInfo'

  /api/container/{name}/restart:
    post:
      summary: 重启容器
      tags: [容器编排]
      parameters:
        - $ref: '#/components/parameters/containerName'
      responses:
        '200':
          description: 重启成功

  /api/container/{name}/stop:
    post:
      summary: 停止容器
      tags: [容器编排]
      parameters:
        - $ref: '#/components/parameters/containerName'
      responses:
        '200':
          description: 停止成功

  /api/container/{name}:
    delete:
      summary: 删除容器
      tags: [容器编排]
      parameters:
        - $ref: '#/components/parameters/containerName'
        - name: force
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 删除成功

  /api/container/{name}/logs:
    get:
      summary: 读取容器日志
      tags: [容器编排]
      parameters:
        - $ref: '#/components/parameters/containerName'
        - name: tail
          in: query
          schema:
            type: integer
            default: 100
        - name: since
          in: query
          schema:
            type: string
          description: 起始时间（ISO 8601）
      responses:
        '200':
          description: 容器日志
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      stdout:
                        type: string
                      stderr:
                        type: string
                      exitCode:
                        type: integer

  /api/tailscale/status:
    get:
      summary: Tailscale 节点状态
      description: 查询 Tailscale 运行状态、对等节点、Subnet Router 配置
      tags: [Tailscale]
      responses:
        '200':
          description: Tailscale 状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TailscaleStatusResponse'

  /api/tailscale/subnet-router:
    post:
      summary: 配置 Subnet Router
      tags: [Tailscale]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subnets]
              properties:
                subnets:
                  type: array
                  items:
                    type: string
                  description: 子网 CIDR 列表
                  example: ['192.168.1.0/24']
      responses:
        '200':
          description: 配置成功

  /api/tailscale/acl:
    post:
      summary: 下发 ACL 策略
      tags: [Tailscale]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Tailscale ACL 策略 JSON
      responses:
        '200':
          description: 策略已应用

  /api/metrics/cpu:
    get:
      summary: CPU 使用率
      description: 双采样差分算法（间隔 300ms），返回使用率、核心数与负载均值
      tags: [系统指标]
      responses:
        '200':
          description: CPU 指标
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CpuUsageResponse'

  /api/metrics/memory:
    get:
      summary: 内存使用
      tags: [系统指标]
      responses:
        '200':
          description: 内存指标
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryUsageResponse'

  /api/metrics/storage:
    get:
      summary: 存储池使用率
      description: 枚举真实块设备挂载点（/proc/mounts + statfs）
      tags: [系统指标]
      responses:
        '200':
          description: 存储池列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoragePoolResponse'

  /api/metrics/overview:
    get:
      summary: 系统概览（仪表盘聚合接口）
      description: 一次请求返回系统信息、CPU、内存、存储池全部指标
      tags: [系统指标]
      responses:
        '200':
          description: 聚合指标
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemOverviewResponse'

  /api/users:
    get:
      summary: 受管用户列表
      description: 合并 /data 数字目录、/etc/passwd 普通用户与 Vibe OS 映射文件
      tags: [用户管理]
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
    post:
      summary: 创建用户数据空间
      description: 创建 /data/{uid}/files、config、cache 目录并设置配额，用户名映射写入 /data/vibeos/users.json
      tags: [用户管理]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'
        '400':
          description: 用户名或 UID 非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 用户名或 UID 已占用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/container/init-dirs:
    post:
      summary: 初始化 AI 应用数据目录
      description: 创建 /data/vibeos/{appname}/models、data、logs，供一键部署在创建容器前调用
      tags: [容器编排]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appname]
              properties:
                appname:
                  type: string
                  description: 应用名（字母/数字/下划线/点/连字符）
      responses:
        '201':
          description: 目录已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDirsInitResponse'
        '400':
          description: 应用名非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ===== 认证模块 =====
  /api/auth/login:
    post:
      tags: [Auth]
      summary: 密码登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: 登录成功，Set-Cookie vibeos.sid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401': { description: 用户名或密码错误 }
        '423': { description: 账号已锁定 }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: 登出（销毁会话）
      responses:
        '200': { description: 已登出 }

  /api/auth/me:
    get:
      tags: [Auth]
      summary: 当前会话用户
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: 用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401': { description: 未登录 }

  /api/auth/change-password:
    post:
      tags: [Auth]
      summary: 修改密码
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 6 }
      responses:
        '200': { description: 密码已修改 }
        '400': { description: 当前密码错误或新密码太短 }

  # ===== OIDC Provider =====
  /.well-known/openid-configuration:
    get:
      tags: [OIDC]
      summary: OpenID Connect 发现文档
      responses:
        '200':
          description: 标准 OIDC 发现文档
          content:
            application/json:
              schema:
                type: object
                properties:
                  issuer: { type: string }
                  authorization_endpoint: { type: string }
                  token_endpoint: { type: string }
                  jwks_uri: { type: string }
                  userinfo_endpoint: { type: string }

  /oidc/jwks.json:
    get:
      tags: [OIDC]
      summary: JWKS 公钥集
      responses:
        '200':
          description: RSA 公钥集（含 kid）
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items: { type: object }

  /oidc/authorize:
    get:
      tags: [OIDC]
      summary: 授权端点
      parameters:
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string } }
        - { name: scope, in: query, required: true, schema: { type: string } }
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, enum: [S256] } }
        - { name: state, in: query, schema: { type: string } }
        - { name: nonce, in: query, schema: { type: string } }
      responses:
        '302': { description: 重定向（登录页/同意页/回调带 code） }
        '400': { description: 参数校验失败 }

  /oidc/token:
    post:
      tags: [OIDC]
      summary: 令牌端点（authorization_code / refresh_token / client_credentials）
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id]
              properties:
                grant_type: { type: string, enum: [authorization_code, refresh_token, client_credentials] }
                client_id: { type: string }
                client_secret: { type: string }
                code: { type: string }
                redirect_uri: { type: string }
                code_verifier: { type: string }
                refresh_token: { type: string }
                scope: { type: string }
      responses:
        '200':
          description: Token 响应
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, enum: [Bearer] }
                  expires_in: { type: integer }
                  id_token: { type: string }
                  refresh_token: { type: string }
                  scope: { type: string }
        '400': { description: 无效授权码/PKCE 失败/参数缺失 }
        '429': { description: 速率限制（30次/分钟/IP） }

  /oidc/userinfo:
    get:
      tags: [OIDC]
      summary: 用户信息端点
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 用户 claims
          content:
            application/json:
              schema:
                type: object
                properties:
                  sub: { type: string }
                  name: { type: string }
                  email: { type: string }
                  uid: { type: integer }
                  username: { type: string }
        '401': { description: token 无效或过期 }

  /oidc/revoke:
    post:
      tags: [OIDC]
      summary: 令牌撤销（RFC 7009）
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200': { description: 已撤销（或静默成功） }

  /oidc/introspect:
    post:
      tags: [OIDC]
      summary: 令牌内省（RFC 7662）
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: 内省结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  active: { type: boolean }
                  scope: { type: string }
                  client_id: { type: string }
                  username: { type: string }
                  exp: { type: integer }

  /oidc/end-session:
    get:
      tags: [OIDC]
      summary: RP-Initiated Logout
      parameters:
        - { name: post_logout_redirect_uri, in: query, schema: { type: string } }
      responses:
        '302': { description: 重定向到 post_logout_redirect_uri }
        '200': { description: 已登出（无重定向 URI 时） }

  # ===== OAuth 客户端管理 =====
  /api/oauth/clients:
    get:
      tags: [OAuth Clients]
      summary: 列出所有客户端
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: 客户端列表 }
    post:
      tags: [OAuth Clients]
      summary: 注册新客户端
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, redirectUris]
              properties:
                name: { type: string }
                redirectUris: { type: array, items: { type: string } }
                scopes: { type: array, items: { type: string } }
                grantTypes: { type: array, items: { type: string } }
      responses:
        '200':
          description: 创建成功（含明文 secret，仅此一次）
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  secret: { type: string }
                  name: { type: string }

  /api/oauth/clients/{id}:
    get:
      tags: [OAuth Clients]
      summary: 客户端详情
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 客户端信息 }
        '404': { description: 不存在 }
    put:
      tags: [OAuth Clients]
      summary: 更新客户端
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 已更新 }
    delete:
      tags: [OAuth Clients]
      summary: 删除客户端
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 已删除 }

  /api/oauth/clients/{id}/reset-secret:
    post:
      tags: [OAuth Clients]
      summary: 重置客户端密钥
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 新密钥（仅此一次）
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  secret: { type: string }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API Token 认证（开发模式可留空跳过）
    cookieAuth:
      type: apiKey
      in: cookie
      name: vibeos.sid
      description: 会话 Cookie（Web UI 登录）

  parameters:
    containerName:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: 容器名称

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    InitDataResult:
      type: object
      properties:
        dataRoot:
          type: string
        createdDirs:
          type: array
          items:
            type: string
        existingDirs:
          type: array
          items:
            type: string
        permissionCheck:
          type: object
          properties:
            dataRootWritable:
              type: boolean
            secretsDirSecure:
              type: boolean
            currentUser:
              type: string
            isRoot:
              type: boolean
        success:
          type: boolean

    UserQuotaInfo:
      type: object
      properties:
        uid:
          type: integer
        dataDir:
          type: string
        usedBytes:
          type: string
        quotaBytes:
          type: string
        usagePercent:
          type: number
        subdirs:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              usedBytes:
                type: string

    DiskHealthResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        totalDisks:
          type: integer
        healthyDisks:
          type: integer
        disks:
          type: array
          items:
            type: object
            properties:
              device:
                type: string
              healthy:
                type: boolean
              temperature:
                type: [integer, 'null']
              powerOnHours:
                type: [integer, 'null']
              model:
                type: [string, 'null']
              serial:
                type: [string, 'null']
              transport:
                type: [string, 'null']
              sizeBytes:
                type: string

    NetworkDriversResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        drivers:
          type: array
          items:
            type: object
            properties:
              driver:
                type: string
              vendor:
                type: string
              product:
                type: string
              loaded:
                type: boolean
              version:
                type: [string, 'null']
              firmware:
                type: [string, 'null']
              pciDevices:
                type: array
                items:
                  type: string
        loadedCount:
          type: integer
        interfaces:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              linkDetected:
                type: boolean
              speed:
                type: [string, 'null']
              duplex:
