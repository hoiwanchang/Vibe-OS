### ============================================================================
### NAISys 无人值守安装 preseed 模板
### 构建期由 build-iso.sh 通过 envsubst 填充占位符后嵌入 ISO
### 占位符：${HOSTNAME} ${USERNAME} ${PASSWORD_CRYPT} ${ROOT_PASSWORD_CRYPT} ${DATA_FSTYPE} ${SYS_SIZE_MB}
### ============================================================================

### --- 本地化与键盘（避免任何交互弹窗）---
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i console-setup/ask_detect boolean false

### --- 网络（DHCP 自动，失败不阻塞）---
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string ${HOSTNAME}
d-i netcfg/get_domain string local
d-i netcfg/hostname string ${HOSTNAME}
d-i hw-detect/load_firmware boolean true

### --- 镜像源（安装阶段仅用于拉取预装包；离线环境可跳过）---
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string trixie

### --- 时钟与时区 ---
d-i clock-setup/utc boolean true
d-i time/zone string Asia/Shanghai
d-i clock-setup/ntp boolean true

### --- 用户与密码（初始密码构建期生成并烘焙，首启引导页强制修改）---
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password ${ROOT_PASSWORD_CRYPT}
d-i passwd/user-fullname string NAISys Administrator
d-i passwd/username string ${USERNAME}
d-i passwd/user-password-crypted password ${PASSWORD_CRYPT}
d-i passwd/user-default-groups string sudo docker

### --- 自动选择第一块硬盘（零交互核心）---
### early_command 在安装器初始化分区前动态探测第一块磁盘，
### 避免硬编码 /dev/sda 在 NVMe/虚拟磁盘下失效。
### [安全加固] 多盘检测：若检测到 >1 块磁盘，写入警告标记，
### 安装后 firstboot 将提示用户确认数据盘未被误格式化。
d-i partman/early_command string \
  disk=$(list-devices disk | head -n1); \
  disk_count=$(list-devices disk | wc -l); \
  debconf-set partman-auto/disk "$disk"; \
  debconf-set grub-installer/bootdev "$disk"; \
  if [ "$disk_count" -gt 1 ]; then \
    mkdir -p /target/var/lib/naisys; \
    echo "MULTI_DISK_DETECTED=$disk_count" > /target/var/lib/naisys/.disk-warning; \
  fi

### --- 分区方案：全盘格式化，自动布局 ---
d-i partman-auto/method string regular
d-i partman-auto/init_automatically_partition select Guided - use entire disk
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true

### --- 自定义分区配方 ---
### [NEEDS REVIEW] 分区容量策略：
###   任务原文为“创建 /data 分区，剩余空间分配给系统”。
###   对 NAS 场景更实用的默认是：系统分区限定上限（${SYS_SIZE_MB}MB），
###   /data 占用全部剩余空间。可通过 config.env / 构建参数调整。
###   partman 配方数值含义：min priority max（单位 MB）。
###   /data 用“小 min + 极大 max + 最高 priority”让 partman 自动占满剩余空间，
###   避免在小于 1TB 的磁盘上因 min 无法满足而安装失败。
d-i partman-auto/expert_recipe string                         \
  naisys-layout ::                                            \
    512 512 512 linux-swap                                    \
      $primary{ } method{ swap } format{ }                    \
    .                                                         \
    ${SYS_SIZE_MB} ${SYS_SIZE_MB} ${SYS_SIZE_MB} ext4          \
      $primary{ } $bootable{ } method{ format }               \
      format{ } use_filesystem{ } filesystem{ ext4 }          \
      mountpoint{ / }                                         \
    .                                                         \
    1000 1000000000 -1 ${DATA_FSTYPE}                          \
      method{ format } format{ }                              \
      use_filesystem{ } filesystem{ ${DATA_FSTYPE} }          \
      mountpoint{ /data }                                     \
    .

d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman/mountpoint select /data

### --- 软件包选择（最小化基础 + 标准工具）---
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string curl jq ca-certificates sudo
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

### --- 引导加载器 ---
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

### --- 安装完成行为：不自动重启（由 late_command 收尾后统一重启）---
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean false

### --- late_command：安装后部署 NAISys 运行时 ---
### 从安装介质复制运行时包与 systemd 单元，安装预装软件，启用服务。
### [修复] 不再静默吞掉 install-runtime.sh 失败，改为记录错误标记供首启诊断。
d-i preseed/late_command string \
  in-target mkdir -p /opt/naisys; \
  cp -r /cdrom/naisys/* /target/opt/naisys/ 2>/dev/null || true; \
  in-target /opt/naisys/install-runtime.sh || \
    in-target bash -c 'echo "INSTALL_RUNTIME_FAILED" > /var/lib/naisys/.install-error'