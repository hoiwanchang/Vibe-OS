# ============================================================================
# UEFI (GRUB) 自动安装菜单项
# build-iso.sh 将此插入 boot/grub/grub.cfg 顶部并设为默认
# ============================================================================
set default=0
set timeout=5

menuentry 'Install Vibe OS (automated)' {
    set gfxpayload=keep
    linux  /install.amd/vmlinuz auto=true priority=critical preseed/file=/preseed.cfg locale=en_US.UTF-8 keymap=us --- quiet
    initrd /install.amd/initrd.gz
}

menuentry 'Install Vibe OS (graphical)' {
    set gfxpayload=keep
    linux  /install.amd/gtk/vmlinuz auto=true priority=critical preseed/file=/preseed.cfg locale=en_US.UTF-8 keymap=us --- quiet
    initrd /install.amd/gtk/initrd.gz
}